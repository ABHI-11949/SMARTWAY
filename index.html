<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <style>
    body { font-family: Arial; }
    .status { font-size: 24px; margin-top: 20px; }
    .green { color: green; }
    .yellow { color: orange; }
    .red { color: red; }
  </style>
</head>
<body>

<h1>Live Student Status</h1>
<div id="status" class="status">Waiting...</div>

<script>
  const ws = new WebSocket("ws://localhost:8000/ws");

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const statusDiv = document.getElementById("status");

    if (data.status === "FOCUSED") {
      statusDiv.innerHTML = "Student is Focused";
      statusDiv.className = "status green";
    }
    else if (data.status === "CONFUSED") {
      statusDiv.innerHTML = "Student is Confused";
      statusDiv.className = "status yellow";
    }
    else {
      statusDiv.innerHTML = "Proctor Alert";
      statusDiv.className = "status red";
    }
  };
</script>

</body>
</html>
