<!DOCTYPE html>
<html>
<head>
  <title>Student Portal</title>
</head>
<body>
  <h2>Student Camera Running...</h2>
  <p>Do not close this window</p>

  <script>
    const ws = new WebSocket("ws://localhost:8000/ws");

    ws.onopen = () => {
      console.log("Connected to backend WebSocket");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      console.log("Status sent to teacher:", data.status);
    };

    // Optional: dummy send every 2 seconds
    setInterval(() => {
      ws.send(JSON.stringify({status: "FOCUSED"}));
    }, 2000);
  </script>
</body>
</html>
